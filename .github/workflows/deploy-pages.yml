name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/nimbus-ai/nimbus-ai/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/nimbus-ai/nimbus-ai/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: Frontend/nimbus-ai/nimbus-ai
      - name: Build frontend
        run: npm run build
        working-directory: Frontend/nimbus-ai/nimbus-ai
        env:
          VITE_API_URL: https://llm-efficiency-backend.onrender.com
          VITE_ENABLE_OLLAMA_MODELS: 'false'
      - name: Configure SPA fallback
        run: cp dist/index.html dist/404.html
        working-directory: Frontend/nimbus-ai/nimbus-ai
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/nimbus-ai/nimbus-ai/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
